# Production deployment: license server behind Caddy, which obtains and renews the HTTPS certificate.
# 1. Point a DNS A record (e.g. licenses.yourdomain.com) at the server.
# 2. Copy .env.example to .env and fill it in; put signing-key.pem in ./secrets (chmod 600).
# 3. docker compose up -d --build   (run from this folder)
services:
  license:
    build:
      context: ../..
      dockerfile: deploy/license-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - license-data:/data
      - ./secrets:/secrets:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - LICENSE_DOMAIN=${LICENSE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - license

volumes:
  license-data:
  caddy-data:
